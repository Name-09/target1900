<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>target 1900</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div id="home">
    <h1>target 1900</h1>
    

    <div id="group-buttons">
     
      <button onclick="startGroup(group1, 'Group 1')">9月12日</button>
      <button onclick="startGroup(group2, 'Group 2')">9月19日</button>
      <button onclick="startGroup(group3, 'Group 3')">10月3日</button>
      <button onclick="startGroup(group4, 'Group 4')">10月24日</button>
      <button onclick="startGroup(group5, 'Group 5')">10月31日</button>
      <button onclick="startGroup(group6, 'Group 6')">11月9日</button>
      <button onclick="startGroup(group7, 'Group 7')">11月14日</button>
      <button onclick="startGroup(group8, 'Group 8')">11月21日</button>
    </div>
  </div>

    <div id="quiz" style="display:none;">
    <h2 id="quiz-title">タイトル</h2>

    <div id="question-area">
      <div id="question-word"></div>
      <div id="choices"></div>
    </div>

    <div id="feedback">
      <div id="result-text"></div>
    </div>

     <div id="correct-mark"></div>
    <div id="wrong-mark"></div>

    <audio id="correct-sound">
      <source src="correct.mp3" type="audio/mpeg">
    </audio>

    <button id="next-btn" onclick="nextQuestion()" style="display:none;">
      次へ進む
    </button>
   </div>

  <div id="result" style="display:none;">
    <h2>結果</h2>
    <p id="score-text"></p>

    <button onclick="startReview()">間違えた問題だけ解き直す</button>
    <button onclick="goHome()">ホームに戻る</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
